<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="login-box">

    <!-- LOGIN -->
    <form id="loginForm" class="form active">

        <h2>Welcome Back</h2>

        <div class="input-box">
            <input type="email" placeholder="Email" required>
        </div>

        <div class="input-box password-box">
            <input type="password" id="loginPass" placeholder="Password" required>
            <i class="fa-solid fa-eye toggle"></i>
        </div>

        <button class="btn">Login</button>

        <div class="divider">OR</div>

        <button type="button" class="social google">
            <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <button type="button" class="social apple">
            <i class="fa-brands fa-apple"></i> Continue with Apple
        </button>

        <button type="button" class="social github">
            <i class="fa-brands fa-github"></i> Continue with GitHub
        </button>

        <p class="switch-text">
            Don't have an account?
            <span id="showSignup">Sign Up</span>
        </p>

    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="form">

        <h2>Create Account</h2>

        <div class="input-box">
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email" required>
        </div>

        <div class="input-box password-box">
            <input type="password" id="signupPass" placeholder="Password" required>
            <i class="fa-solid fa-eye toggle"></i>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Confirm Password" required>
        </div>

        <button class="btn">Create Account</button>

        <p class="switch-text">
            Already have an account?
            <span id="showLogin">Login</span>
        </p>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
